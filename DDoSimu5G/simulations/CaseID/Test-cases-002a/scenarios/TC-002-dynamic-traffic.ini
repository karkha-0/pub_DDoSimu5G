#
# TC-002 Dynamic Traffic Test Configuration
# Simple test for DynamicTrafficApp with multiple backend servers
#

[General]
network = scenarios.ned.TC002_Network_Dynamic
#description = "Dynamic Traffic Test - Simple IoT Traffic Patterns - Do not select"
description = "General Configurations - Do not select"

sim-time-limit = 600s
warmup-period = 1s
repeat = 1
seed-set = ${repetition}

############### Statistics ##################
output-scalar-file-append = false
**.routingRecorder.enabled = false
record-eventlog = false

**.vector-recording = false
**.scalar-recording = false

# Results output
output-scalar-file = ../run_results/scalars/${configname}/${datetime}/TC002-dynamic-r${repetition}.sca 
output-vector-file = ../run_results/vectors/${configname}/${datetime}/TC002-dynamic-r${repetition}.vec

allow-object-stealing-on-deletion = true

############### DataTrafficController - Benign Mode ##############
# Disable attack apps for benign traffic (overridden in DDoS configs)
*.dataTrafficController.enableAttackApps = false
*.dataTrafficController.enableTrafficMod = false

############### FCS/CRC Configuration ##############
**.crcMode = "computed"
**.fcsMode = "computed"

############### Network configuration ##################
*.configurator.config = xmldoc("../config/network/hosts_net_config.xml")

############### Internet Cloud config ##############
**.internetCloud.ipv4Delayer.config = xmldoc("../config/network/internetcloud_config_dynamic.xml")

############### General PHY parameters ##############
**.downlink_interference = true
**.uplink_interference = true
**.ueTxPower = 26
**.eNodeBTxPower = 46
**.targetBler = 0.01
**.blerShift = 5
**.fbPeriod = 40

############# Floorplan parameters ################
**.mobility.constraintAreaMaxX = 2000m
**.mobility.constraintAreaMaxY = 2000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

############### BS position #################
*.gnb1.mobility.initialX = 500m
*.gnb1.mobility.initialY = 1300m
*.gnb2.mobility.initialX = 500m
*.gnb2.mobility.initialY = 900m
*.gnb3.mobility.initialX = 1000m
*.gnb3.mobility.initialY = 900m
*.gnb4.mobility.initialX = 1500m
*.gnb4.mobility.initialY = 900m
*.gnb5.mobility.initialX = 1500m
*.gnb5.mobility.initialY = 1300m

############### CA configuration ################# 
# 3 component carriers, 6 RBs each → wider channel capacity for more UEs
*.carrierAggregation.numComponentCarriers = 3
*.carrierAggregation.componentCarrier[0].numerologyIndex = 0
*.carrierAggregation.componentCarrier[0].carrierFrequency = 2.1GHz
*.carrierAggregation.componentCarrier[0].numBands = 6
*.carrierAggregation.componentCarrier[1].numerologyIndex = 0
*.carrierAggregation.componentCarrier[1].carrierFrequency = 2.2GHz
*.carrierAggregation.componentCarrier[1].numBands = 6
*.carrierAggregation.componentCarrier[2].numerologyIndex = 0
*.carrierAggregation.componentCarrier[2].carrierFrequency = 2.3GHz
*.carrierAggregation.componentCarrier[2].numBands = 6

*.gnb*.cellularNic.numCarriers = 3
*.gnb*.cellularNic.channelModel[0].componentCarrierIndex = 0
*.gnb*.cellularNic.channelModel[1].componentCarrierIndex = 1
*.gnb*.cellularNic.channelModel[2].componentCarrierIndex = 2
*.dynamicUe[*].cellularNic.numCarriers = 3
*.dynamicUe[*].cellularNic.nrChannelModel[0].componentCarrierIndex = 0
*.dynamicUe[*].cellularNic.nrChannelModel[1].componentCarrierIndex = 1
*.dynamicUe[*].cellularNic.nrChannelModel[2].componentCarrierIndex = 2

############### UPF configuration ##################
*.upf.numApps = 0
*.iUpf.numApps = 0

############## UE configuration ##################
*.numDynamicUe = 5

# UEs associate to the best BS
*.dynamicUe[*].macCellId = 0
*.dynamicUe[*].masterId = 0
*.dynamicUe[*].nrMacCellId = 1
*.dynamicUe[*].nrMasterId = 1
**.dynamicCellAssociation = true
**.enableHandover = false

# Stationary UEs for initial testing (no mobility, so no handover needed)
*.dynamicUe[*].mobilityType = "StationaryMobility"
*.dynamicUe[*].mobility.initialX = uniform(300m, 1800m) 
*.dynamicUe[*].mobility.initialY = uniform(300m, 1800m)

# Dynamic Traffic App Configuration
*.dynamicUe[*].numApps = 10
*.dynamicUe[*].app[*].typename = "DynamicTrafficSender"

############### X2 configuration #################
## Note all gnbs need to be conncted to all if we going to place them randomly around the map
*.gnb1.numX2Apps = 1 
*.gnb2.numX2Apps = 1 
*.gnb3.numX2Apps = 1 
*.gnb5.numX2Apps = 1 
*.gnb4.numX2Apps = 1    
*.gnb*.x2App[*].server.localPort = 5000 + ancestorIndex(1)  # Server ports (x2App[0]=5000, x2App[1]=5001, ...)

*.gnb1.x2App[0].client.connectAddress = "gnb2%x2ppp1"

*.gnb2.x2App[0].client.connectAddress = "gnb3%x2ppp1"

*.gnb3.x2App[0].client.connectAddress = "gnb4%x2ppp1"

*.gnb4.x2App[0].client.connectAddress = "gnb5%x2ppp1"

*.gnb5.x2App[0].client.connectAddress = "gnb1%x2ppp1"

############## Server configuration ##################
# Receiver app on backend servers
*.udpServer.numApps = 1
*.udpServer.app[0].typename = "DynamicTrafficReceiver"
*.udpServer.app[0].udpPort = 5000
*.udpServer.app[0].echoMode = true

*.tcpServer.numApps = 1
*.tcpServer.app[0].typename = "DynamicTrafficReceiver"
*.tcpServer.app[0].tcpPort = 5001
*.tcpServer.app[0].echoMode = true

*.httpServer.numApps = 1
*.httpServer.app[0].typename = "DynamicTrafficReceiver"
*.httpServer.app[0].httpPort = 80
*.httpServer.app[0].echoMode = true

*.dnsServer.numApps = 1
*.dnsServer.app[0].typename = "DynamicTrafficReceiver"
*.dnsServer.app[0].dnsPort = 53
*.dnsServer.app[0].echoMode = true

# NOTE: SilentTcp overrides INET's Tcp to silently drop segments
# to closed ports (no RST back-scatter).  The SYN-flood attack targets
# port 9998 which has no listener — SilentTcp discards those SYNs.
*.generalServer.tcp.typename = "ddosimu5g.common.SilentTcp"
*.generalServer.numApps = 2
*.generalServer.app[*].typename = "DynamicTrafficReceiver"
*.generalServer.app[0].udpPort = 9999
*.generalServer.app[1].httpPort = 80
*.generalServer.app[0].echoMode = false
*.generalServer.app[1].echoMode = false

############### PCAP Traffic Capture Configuration ##################
# Capture traffic at gNodeBs and UPF for DDoS analysis
# Configure PcapRecorder on pppIf interface (INET native approach)

# gNodeB PCAP - capture on pppIf interface (between gNodeB and iUpf)
*.gnb1.pppIf.numPcapRecorders = 1
*.gnb1.pppIf.pcapRecorder[0].pcapFile = "../run_results/pcaps/${configname}/${datetime}/gnb1.pcap"
*.gnb1.pppIf.pcapRecorder[0].alwaysFlush = true
*.gnb1.pppIf.pcapRecorder[0].verbose = true

*.gnb2.pppIf.numPcapRecorders = 1
*.gnb2.pppIf.pcapRecorder[0].pcapFile = "../run_results/pcaps/${configname}/${datetime}/gnb2.pcap"
*.gnb2.pppIf.pcapRecorder[0].alwaysFlush = true
*.gnb2.pppIf.pcapRecorder[0].verbose = true

*.gnb3.pppIf.numPcapRecorders = 1
*.gnb3.pppIf.pcapRecorder[0].pcapFile = "../run_results/pcaps/${configname}/${datetime}/gnb3.pcap"
*.gnb3.pppIf.pcapRecorder[0].alwaysFlush = true
*.gnb3.pppIf.pcapRecorder[0].verbose = true

*.gnb4.pppIf.numPcapRecorders = 1
*.gnb4.pppIf.pcapRecorder[0].pcapFile = "../run_results/pcaps/${configname}/${datetime}/gnb4.pcap"
*.gnb4.pppIf.pcapRecorder[0].alwaysFlush = true
*.gnb4.pppIf.pcapRecorder[0].verbose = true

*.gnb5.pppIf.numPcapRecorders = 1
*.gnb5.pppIf.pcapRecorder[0].pcapFile = "../run_results/pcaps/${configname}/${datetime}/gnb5.pcap"
*.gnb5.pppIf.pcapRecorder[0].alwaysFlush = true
*.gnb5.pppIf.pcapRecorder[0].verbose = true

# UPF PCAP - capture on pppIf interface (between UPF and internet cloud)
*.upf.pppIf.numPcapRecorders = 1
*.upf.pppIf.pcapRecorder[0].pcapFile = "../run_results/pcaps/${configname}/${datetime}/upf.pcap"
*.upf.pppIf.pcapRecorder[0].alwaysFlush = true
*.upf.pppIf.pcapRecorder[0].verbose = true

#=============================================================================
# Configuration: Simple Single Profile Test
#=============================================================================
[Config Dynamic-Simple-Test]
description = "Simple test with ONE Benign traffic profile only (smart meter)"

*.numDynamicUe = 1
*.dynamicUe[0].app[*].trafficScheduleFile = "../config/trafficSchedules/iot_smart_meter.json"

# Label files for out-of-band traffic labeling (matching PCAP naming convention)
*.dynamicUe[*].app[*].labelFilePath = "../run_results/pcaps/${configname}/${datetime}"


#=============================================================================
# Configuration: All Profiles Test
#=============================================================================
[Config All-Profiles-Test]
description = "Test with ALL 6 Benign traffic profiles"

*.numDynamicUe = 6
*.dynamicUe[0].app[*].trafficScheduleFile = "../config/trafficSchedules/smartphone_user.json"
*.dynamicUe[1].app[*].trafficScheduleFile = "../config/trafficSchedules/video_streamer.json"
*.dynamicUe[2].app[*].trafficScheduleFile = "../config/trafficSchedules/iot_wearable_health_monitor.json"
*.dynamicUe[3].app[*].trafficScheduleFile = "../config/trafficSchedules/iot_smart_meter.json"
*.dynamicUe[4].app[*].trafficScheduleFile = "../config/trafficSchedules/iot_connected_vehicle.json"
*.dynamicUe[5].app[*].trafficScheduleFile = "../config/trafficSchedules/iot_drone_control.json"

# Label files for out-of-band traffic labeling (matching PCAP naming convention)
*.dynamicUe[*].app[*].labelFilePath = "../run_results/pcaps/${configname}/${datetime}"

#=============================================================================
# Configuration: Stress Test
#=============================================================================
[Config Stress-Test]
description = "Stress test with 30 UEs cycling through all 6 Benign profiles"

*.numDynamicUe = 30
*.dynamicUe[0..4].app[*].trafficScheduleFile = "../config/trafficSchedules/smartphone_user.json"
*.dynamicUe[5..9].app[*].trafficScheduleFile = "../config/trafficSchedules/video_streamer.json"
*.dynamicUe[10..14].app[*].trafficScheduleFile = "../config/trafficSchedules/iot_wearable_health_monitor.json"
*.dynamicUe[15..19].app[*].trafficScheduleFile = "../config/trafficSchedules/iot_smart_meter.json"
*.dynamicUe[20..24].app[*].trafficScheduleFile = "../config/trafficSchedules/iot_connected_vehicle.json"
*.dynamicUe[25..29].app[*].trafficScheduleFile = "../config/trafficSchedules/iot_drone_control.json"

# Label files for out-of-band traffic labeling (one per UE, all apps share)
*.dynamicUe[*].app[*].labelFilePath = "../run_results/pcaps/${configname}/${datetime}"


#=============================================================================
# DDoS ATTACK TESTING CONFIGURATIONS 
#=============================================================================
[Config DDoS-General-Settings]
extends = General
description = "General DDoS Attack Settings - Do not select"

# Enable TC-002 attack mode (override benign default)
*.dataTrafficController.enableAttackApps = true
*.dataTrafficController.enableTrafficMod = false
*.dataTrafficController.ueModuleName = "dynamicUe"  
*.dataTrafficController.attackSlotStart = 10  
*.dataTrafficController.attackSlotEnd = 19    

*.dynamicUe[*].numApps = 20
*.dynamicUe[*].app[10..19].typename = "BaseAttackApp"
*.dynamicUe[*].app[10..19].startTime = -1s
*.dynamicUe[*].app[10..19].stopTime = -1s

[Config DDoS-Single-UE-UDP-Intense]
extends = DDoS-General-Settings
description = "Test 1: Single UE with UDP Flood - Intense style"


*.dataTrafficController.infectionFilePath = "../config/infectionTraces/infection_single_ue.json"

*.numDynamicUe = 1
*.dynamicUe[0].app[*].trafficScheduleFile = "../config/trafficSchedules/smartphone_user.json"

# Attack apps will be created dynamically by DataTrafficController
# No pre-configuration needed!
# app number is the first attackslot and one can set many attack apps simultaneously by using multiple attack slots and configuring them in the JSON attack profile 
*.dynamicUe[0].app[10].attackProfileFile = "../config/trafficSchedules/attack_udp_intense_coexist.json"

# Label files for out-of-band traffic labeling (one per UE, all apps share)
*.dynamicUe[*].app[*].labelFilePath = "../run_results/pcaps/${configname}/${datetime}"

[Config DDoS-Attack-UDP-Style-Comparison]
extends = DDoS-General-Settings
description = "Test 2: 3 UEs comparing UDP-Flooding attack styles - Intense vs Pulsing vs Slowrate"

*.dataTrafficController.infectionFilePath = "../config/infectionTraces/infection_3ue_styles.json"

*.numDynamicUe = 3
*.dynamicUe[0].app[*].trafficScheduleFile = "../config/trafficSchedules/smartphone_user.json"
*.dynamicUe[1].app[*].trafficScheduleFile = "../config/trafficSchedules/video_streamer.json"
*.dynamicUe[2].app[*].trafficScheduleFile = "../config/trafficSchedules/iot_smart_meter.json"

# Attack apps will be created dynamically based on JSON attack profiles
# Per-UE attack profiles for different styles
*.dynamicUe[0].app[10].attackProfileFile = "../config/trafficSchedules/attack_udp_intense_coexist.json"
*.dynamicUe[1].app[10].attackProfileFile = "../config/trafficSchedules/attack_udp_pulsing_replace.json"
*.dynamicUe[2].app[10].attackProfileFile = "../config/trafficSchedules/attack_udp_slowrate_hybrid.json"

# Label files for out-of-band traffic labeling 
*.dynamicUe[*].app[*].labelFilePath = "../run_results/pcaps/${configname}/${datetime}"

[Config DDoS-Attack-DNS-Style-Comparison]
extends = DDoS-General-Settings
description = "Test 3: 3 UEs comparing DNS-Amplification attack styles - Intense vs Pulsing vs Stealthy"

*.dataTrafficController.infectionFilePath = "../config/infectionTraces/infection_3ue_styles.json"
#*.dataTrafficController.infectionFilePath = "../config/infectionTraces/infection_single_ue.json"  

*.numDynamicUe = 3
*.dynamicUe[0].app[*].trafficScheduleFile = "../config/trafficSchedules/smartphone_user.json"
*.dynamicUe[1].app[*].trafficScheduleFile = "../config/trafficSchedules/video_streamer.json"
*.dynamicUe[2].app[*].trafficScheduleFile = "../config/trafficSchedules/iot_smart_meter.json"

# Attack apps will be created dynamically based on JSON attack profiles
# Per-UE attack profiles for different styles
*.dynamicUe[0].app[10].attackProfileFile = "../config/trafficSchedules/attack_dns_intense_replace.json"
*.dynamicUe[1].app[10].attackProfileFile = "../config/trafficSchedules/attack_dns_pulsing_hybrid.json"
*.dynamicUe[2].app[10].attackProfileFile = "../config/trafficSchedules/attack_dns_stealthy_coexist.json"

# Label files for out-of-band traffic labeling 
*.dynamicUe[*].app[*].labelFilePath = "../run_results/pcaps/${configname}/${datetime}"

[Config DDoS-Attack-TCP-Style-Comparison]
