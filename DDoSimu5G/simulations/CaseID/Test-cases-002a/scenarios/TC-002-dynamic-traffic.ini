*.dynamicUe[1].app[10].attackProfileFile = "../config/trafficSchedules/attack_http_ramping_coexist.json"
*.dynamicUe[2].app[10].attackProfileFile = "../config/trafficSchedules/attack_http_slowrate_coexist.json"

# Label files for out-of-band traffic labeling 
*.dynamicUe[*].app[*].labelFilePath = "../run_results/pcaps/${configname}/${datetime}"

[Config DDoS-Multi-Attack-Multi-Behavior]
extends = DDoS-General-Settings
description = "Test 6: 13 attack UEs + 12 benign-only UEs for balanced dataset"

# Enable TC-002 attack mode
*.dataTrafficController.infectionFilePath = "../config/infectionTraces/infection_12ue_comprehensive.json"  

# 31 total UEs: 13 dual-use (attack+benign) + 12 benign-only
*.numDynamicUe = 31

# --- Dual-use UEs 0-12 (attack + benign traffic) ---
*.dynamicUe[0..2].app[*].trafficScheduleFile = "../config/trafficSchedules/iot_industrial_sensor.json"
*.dynamicUe[3..5].app[*].trafficScheduleFile = "../config/trafficSchedules/iot_wearable_health_monitor.json"
*.dynamicUe[6..8].app[*].trafficScheduleFile = "../config/trafficSchedules/iot_smart_meter.json"
*.dynamicUe[9..12].app[*].trafficScheduleFile = "../config/trafficSchedules/iot_connected_vehicle.json"

# --- Benign-only UEs 13-24 (no attack apps, 3 profiles cycled) ---
*.dynamicUe[13..16].app[*].trafficScheduleFile = "../config/trafficSchedules/iot_wearable_health_monitor.json"
*.dynamicUe[17..20].app[*].trafficScheduleFile = "../config/trafficSchedules/iot_smart_meter.json"
*.dynamicUe[21..24].app[*].trafficScheduleFile = "../config/trafficSchedules/iot_connected_vehicle.json"
*.dynamicUe[25..27].app[].trafficScheduleFile = "../config/trafficSchedules/iot_drone_control.json"
*.dynamicUe[28..30].app[].trafficScheduleFile = "../config/trafficSchedules/iot_asset_tracker.json"

# Attack apps will be created dynamically based on JSON attack profiles
# Attack Type Distribution:
# Group 1 (UE 0-2): UDP Flood with Coexistence, Replace, Hybrid
*.dynamicUe[0].app[10].attackProfileFile = "../config/trafficSchedules/attack_udp_intense_coexist.json"
*.dynamicUe[1].app[10].attackProfileFile = "../config/trafficSchedules/attack_udp_pulsing_replace.json"
*.dynamicUe[2].app[10].attackProfileFile = "../config/trafficSchedules/attack_udp_slowrate_hybrid.json"

# Group 2 (UE 3-6): TCP SYN Flood with Coexistence, Replace, Hybrid
*.dynamicUe[3].app[10].attackProfileFile = "../config/trafficSchedules/attack_tcp_stealthy_replace.json"
*.dynamicUe[4].app[10].attackProfileFile = "../config/trafficSchedules/attack_tcp_intense_replace.json"
*.dynamicUe[5].app[10].attackProfileFile = "../config/trafficSchedules/attack_tcp_ramping_hybrid.json"
*.dynamicUe[6].app[10].attackProfileFile = "../config/trafficSchedules/attack_tcp_intense_coexistence.json"

# Group 3 (UE 7-9): DNS Amplification with Coexistence, Replace, Hybrid
*.dynamicUe[7].app[10].attackProfileFile = "../config/trafficSchedules/attack_dns_pulsing_hybrid.json"
*.dynamicUe[8].app[10].attackProfileFile = "../config/trafficSchedules/attack_dns_stealthy_coexist.json"
*.dynamicUe[9].app[10].attackProfileFile = "../config/trafficSchedules/attack_dns_intense_replace.json"

# Group 4 (UE 10-12): HTTP Flood with Coexistence, Replace, Hybrid
*.dynamicUe[10].app[10].attackProfileFile = "../config/trafficSchedules/attack_http_ramping_coexist.json"
*.dynamicUe[11].app[10].attackProfileFile = "../config/trafficSchedules/attack_http_slowrate_coexist.json"
*.dynamicUe[12].app[10].attackProfileFile = "../config/trafficSchedules/attack_http_ramping_coexist.json"

# Label files
*.dynamicUe[*].app[*].labelFilePath = "../run_results/pcaps/${configname}/${datetime}"


