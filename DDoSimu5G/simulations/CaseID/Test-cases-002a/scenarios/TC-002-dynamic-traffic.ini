[Config DDoS-Attack-HTTP-Style-Comparison]
extends = DDoS-General-Settings
description = "Test 5: 3 UEs comparing HTTP Flood attack styles - Intense vs Ramping vs Stealthy"

*.dataTrafficController.infectionFilePath = "../config/infectionTraces/infection_3ue_styles.json"

*.numDynamicUe = 3
*.dynamicUe[0].app[*].trafficScheduleFile = "../config/trafficSchedules/smartphone_user.json"
*.dynamicUe[1].app[*].trafficScheduleFile = "../config/trafficSchedules/video_streamer.json"
*.dynamicUe[2].app[*].trafficScheduleFile = "../config/trafficSchedules/iot_smart_meter.json"

